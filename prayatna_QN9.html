<!DOCTYPE html>
<html>
<body>

<div id="box"></div>

<script>
let n = Number(prompt("Enter limit:"));
document.write("Because You Entered "+n);
let box = document.getElementById("box");

function prime(x){
    if(x < 2) return false;
    for(let i=2; i<x; i++)
        if(x%i==0) return false;
    return true;
}

for(let i=1; i<=n; i++){
    let p = document.createElement("span");
    p.innerHTML = i + " ";

    if(prime(i))
        p.style.color = "red";
    else if(i%2==0)
        p.style.color = "green";
    else
        p.style.color = "blue";

    box.appendChild(p);
}
</script>

</body>
</html>
