<!DOCTYPE html>
<html>
<head>
<style>
#container {
    display: flex;
    flex-wrap: wrap;
}
.box {
    width: 30px;
    height: 30px;
    margin: 2px;
    text-align: center;
}
</style>
</head>

<body>

<div id="container"></div>

<script>
let container = document.getElementById("container");

function prime(n){
    if(n < 2) return false;
    for(let i=2; i<=Math.sqrt(n); i++)
        if(n%i==0) return false;
    return true;
}

for(let i=0; i<=100; i++){
    let div = document.createElement("div");
    div.className = "box";
    div.textContent = i;

    if(prime(i))
        div.style.background = "red";
    else if(i%2==0)
        div.style.background = "green";
    else
        div.style.background = "yellow";

    container.appendChild(div);
}
</script>

</body>
</html>
