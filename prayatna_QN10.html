<!DOCTYPE html>
<html>
<head>
<style>
button{
    background:green;
    color:white;
    padding:3px 20px;
    margin:5px;
    border-radius:5px;
}
#count{
    background:pink;
    padding:3px 25px;
}
</style>
</head>
<body style="text-align: center;">
<h3>Counter App</h3>
<button onclick="add(1)">+</button>
<button id="count" style="color: black;">0</button>
<button onclick="add(-1)">-</button><br>
<button onclick="reset()">Reset</button>
<script>
let c = 0;
function add(x){
    c+=x;
    document.getElementById("count").innerHTML=c;
}
function reset(){
    document.getElementById("count").innerHTML= 0;
}
</script>
</body>
</html>
