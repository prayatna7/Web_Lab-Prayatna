<!DOCTYPE html>
<html>
<head>
    <title>Navigation Menu Layout</title>
    <style>
        .navbar {
            background-color: #fffa36;
            padding: 15px;
        }
        .navbar ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
        }
        .navbar li {
            display: flex;
            align-items: center;
        }
        .navbar a {
            text-decoration: none;
            color: #4b0082;
            font-family: sans-serif;
            font-size: 18px;
            padding: 5px 10px;
        }
        .navbar .active a {
            background-color: #5d3fd3;
            color: white;
            border: 1px solid #4b0082;
        }
        .divider {
            color: #333;
            font-size: 20px;
            padding: 0 5px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <ul>
            <li class="active"><a href="#">Home</a></li>
            <span class="divider">|</span>
            <li><a href="#">About</a></li>
            <span class="divider">|</span>
            <li><a href="#">Services</a></li>
            <span class="divider">|</span>
            <li><a href="#">Gallery</a></li>
            <span class="divider">|</span>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

</body>
</html>
