<!DOCTYPE html>
<html>
<head>
<style>
.calculator{
    width:260px;
}
input{
    width:183px;
    height:35px;
}
button{
    width:60px;
    height:35px;
    margin:2px;
    background:green;
    color:white;
    border: none;
    border-radius: 7%;
}
</style>
</head>
<body>
<div class="calculator" style="border: 1px solid black; display: flex; flex-wrap: wrap;">
<div id="r1" style="display: flex;">
<input id="screen" readonly>
<button onclick="clearScreen()">C</button><br>
</div>
<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button onclick="add('/')">/</button><br>
<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button onclick="add('*')">*</button><br>
<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button onclick="add('-')">-</button><br>
<button onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
<button onclick="calculate()">=</button>
<button onclick="add('+')">+</button>
</div>
<script>
function add(x){
    document.getElementById("screen").value += x;
}
function calculate(){
    document.getElementById("screen").value += " = "+
    eval(document.getElementById("screen").value);
}
function clearScreen(){
    document.getElementById("screen").value="";
}
</script>
</body>
</html>
