<!DOCTYPE html>
<html>
<head>
    <title>Dropdown Navigation Menu</title>
    <style>
        body {
            background: linear-gradient(135deg, #7b1fa2, #1565c0);
            font-family: sans-serif;
            height: 100vh;
            margin: 0;
            padding: 30px;
        }
        .navbar {
            background-color: #f5f5f5;
            display: flex;
            justify-content: space-around;
            padding: 0;
            margin: 0;
            list-style: none;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .nav-item {
            position: relative;
            width: 100%;
            text-align: center;
        }
        .nav-item a {
            display: block;
            padding: 15px 20px;
            color: #000;
            text-decoration: none;
            font-weight: 500;
        }
        .dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 15%;
            background-color: #f5f5f5;
            list-style: none;
            padding: 0;
            margin: 0;
            min-width: 180px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            text-align: left;
        }
        .dropdown a {
            padding: 10px 15px;
            font-size: 14px;
        }
        .dropdown a:hover {
            background-color: #ffffff;
        }
        .nav-item:hover .dropdown {
            display: block;
        }
    </style>
</head>
<body>

    <ul class="navbar">
        <li class="nav-item"><a href="#">Home</a></li>
        <li class="nav-item">
            <a href="#">Services ^</a>
            <ul class="dropdown">
                <li><a href="#">Design</a></li>
                <li><a href="#">Development</a></li>
                <li><a href="#">Accessibility</a></li>
                <li><a href="#">Content Strategy</a></li>
                <li><a href="#">Training</a></li>
            </ul>
        </li>
        <li class="nav-item"><a href="#">Portfolio </a></li>
        <li class="nav-item"><a href="#">About </a></li>
    </ul>

</body>
</html>
