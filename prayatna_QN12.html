<!DOCTYPE html>
<html>
<head>
<style>
.clock{
    background:purple;
    width:270px;
    padding:15px;
    text-align:center;
    color:white;
    font-weight:bold;
}

.box{
    display:inline-block;
    background:white;
    color:black;
    font-size:35px;
    padding:10px;
    margin:5px;
}
</style>
</head>

<body>

<div class="clock">
<h2>DIGITAL CLOCK</h2>

<div class="box" id="hour">00</div> :
<div class="box" id="minute">00</div> :
<div class="box" id="second">00</div>

</div>

<script>
function clock(){
    let time = new Date();

    document.getElementById("hour").innerHTML =
    String(time.getHours()).padStart(2,'0');

    document.getElementById("minute").innerHTML =
    String(time.getMinutes()).padStart(2,'0');

    document.getElementById("second").innerHTML =
    String(time.getSeconds()).padStart(2,'0');
}

setInterval(clock,1000);
clock();
</script>

</body>
</html>
