<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Overlay</title>
    <style>
        body {
            background-color: #6499b2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .card {
            position: relative;
            width: 300px;
            height: 400px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .overlay {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(transparent, rgba(0,0,0,0.9) 70%);
            padding: 30px 20px;
            color: #fff;
            box-sizing: border-box;
            opacity: 0;
            transition: 0.4s;
        }
        .card:hover .overlay {
            opacity: 1;
        }
        h2 { margin: 0 0 8px; font-size: 22px; }
        p { margin: 0 0 15px; font-size: 13px; color: #ccc; }
        a {
            display: inline-block;
            background: #fff;
            color: #000;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://png.pngtree.com/thumb_back/fh260/background/20241112/pngtree-single-tree-on-a-hill-image_16549353.jpg" alt="Tree landscape">
        <div class="overlay">
            <h2>Card Title</h2>
            <p>This is a sample card description</p>
            <a href="#">Read More</a>
        </div>
    </div>

</body>
</html>
