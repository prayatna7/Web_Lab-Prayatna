<!DOCTYPE html>
<html>
<head>
<style>
body{
    font-family:Arial;
}
input,select{
    margin:5px;
    padding:5px;
}
</style>
</head>
<body>
<h3>Registration Form</h3>
<form onsubmit="return validate()">
Name:
<input id="name"><br>
Address:
<input id="address"><br>
Username:
<input id="user"><br>
Email:
<input id="email"><br>
Password:
<input type="password" id="pass"><br>
Website:
<input id="web"><br>
Phone:
<input id="phone"><br>
Gender:
<input type="radio" name="g" value="Male">Male
<input type="radio" name="g" value="Female">Female<br>
Course:
<select id="course">
<option value="">Select</option>
<option>BCA</option>
<option>BIM</option>
<option>BIT</option>
</select><br>
<button>Submit</button>
</form>
<script>
function validate(){
let name=document.getElementById("name").value;
let address=document.getElementById("address").value;
let user=document.getElementById("user").value;
let email=document.getElementById("email").value;
let pass=document.getElementById("pass").value;
let phone=document.getElementById("phone").value;
let course=document.getElementById("course").value;
let gender=document.querySelector('input[name="g"]:checked');
if(!/^[A-Za-z ]+$/.test(name))
alert("Invalid Name");
else if(!/^[A-Za-z0-9_]+$/.test(user))
alert("Invalid Username");
else if(!/^(98|97|96)[0-9]{8}$/.test(phone))
alert("Invalid Phone");
else if(address=="")
alert("Enter Address");
else if(!email.includes("@"))
alert("Invalid Email");
else if(!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@#$%]).{8,}$/.test(pass))
alert("Invalid Password");
else if(!gender)
alert("Select Gender");
else if(course=="")
alert("Select Course");
else
alert("Form Submitted");
return false;
}
</script>
</body>
</html>
