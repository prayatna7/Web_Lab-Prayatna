<!DOCTYPE html>
<html>
<head>
<title>Button Events</title>
</head>

<body>

<p id="txt">
This is a sample paragraph for JavaScript events.
</p>

<button onclick="document.body.style.background='lightblue'">
Change BG
</button>

<button onclick="txt.style.background='yellow'">
Change Paragraph BG
</button>

<button onclick="txt.style.display='none'">
Hide Para
</button>

<button onclick="txt.style.display='block'">
Show Para
</button>

<button onclick="txt.style.fontSize=(parseInt(getComputedStyle(txt).fontSize)+2)+'px'">
Inc. Font Size
</button>

<button onclick="txt.style.fontSize=(parseInt(getComputedStyle(txt).fontSize)-2)+'px'">
Dec. Font Size
</button>

<button onclick="txt.style.fontSize='12px'">
Reset Font to 12pt
</button>

<button onclick="txt.style.color='red'">
Change Text Color
</button>

</body>
</html>
