<!DOCTYPE html>
<html>
<body>

<h3>Age Calculator</h3>

Enter Birth Year:
<input id="year">
<button onclick="age()">Calculate</button>

<p id="result"></p>

<script>
function age(){
    let y = document.getElementById("year").value;
    let a = 2026 - y;
    document.getElementById("result").innerHTML = "Age: " + a;
}
</script>

</body>
</html>
