<!DOCTYPE html>
<html>
<body>

<script>
let a = Number(prompt("Enter first integer:"));
let b = Number(prompt("Enter second integer:"));
let c = Number(prompt("Enter third integer:"));
document.write("You entered "+a+", "+b+" &"+c+"<br>")
let large = Math.max(a,b,c);
let small = Math.min(a,b,c);

document.write("Larger: " + large + "<br>");
document.write("Smaller: " + small);
</script>

</body>
</html>
