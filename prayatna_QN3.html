<!DOCTYPE html>
<html>
<body>

<script>
let a = Number(prompt("Enter first integer:"));
let b = Number(prompt("Enter second integer:"));
document.write("You entered "+a+","+b+"<br>")
if(a > b)
    document.write("Larger: " + a + "<br>Smaller: " + b);
else
    document.write("Larger: " + b + "<br>Smaller: " + a);
</script>

</body>
</html>
