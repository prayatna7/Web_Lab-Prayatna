<!DOCTYPE html>
<html>
<head>
<title>Clone and Remove Row</title>

<style>
table{width:50%;border-collapse:collapse}
td,th{border:1px solid #ddd;padding:8px}
button{padding:5px}
</style>

</head>

<body>

<table id="tbl">

<tr>
<th>No</th>
<th>Product</th>
<th>Price</th>
<th>Action</th>
</tr>

<tr class="r">
<td>1</td>

<td>
<select>
<option>Select Product</option>
<option>Mouse</option>
<option>Keyboard</option>
</select>
</td>

<td><input type="text"></td>

<td>
<button onclick="del(this)">🗑</button>
</td>

</tr>

</table>

<br>

<button onclick="add()">Add New</button>

<script>

function add(){
let r=document.querySelector(".r:last-child").cloneNode(true);
r.querySelector("input").value="";
document.getElementById("tbl").appendChild(r);
num();
}

function del(x){
if(document.querySelectorAll(".r").length>1)
x.parentElement.parentElement.remove();
num();
}

function num(){
document.querySelectorAll(".r")
.forEach((r,i)=>r.cells[0].innerHTML=i+1);
}

</script>

</body>
</html>
