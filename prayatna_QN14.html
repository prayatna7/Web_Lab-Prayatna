<!DOCTYPE html>
<html>
<head>
    <title>Float Layout Structure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
            font-size: 14px;
        }

        .header {
            background-color: #4b527e;
            height: 100px;
            padding: 10px;
        }

        .menu {
            background-color: #7b8e7c;
            height: 40px;
            padding: 10px;
        }

        /* Container to group all floated columns together */
        .main-container {
            width: 100%;
        }

        .left-side {
            background-color: #a85454;
            width: 25%;
            height: 400px;
            float: left;
            padding: 10px;
        }

        .content {
            background-color: #03a9f4;
            width: 50%;
            height: 400px;
            float: left;
            padding: 10px;
        }

        .right-side {
            background-color: #7c73f6;
            width: 25%;
            height: 400px;
            float: left;
            padding: 10px;
        }

        .footer {
            background-color: #757575;
            height: 40px;
            padding: 10px;
            clear: both; /* Prevents the footer from breaking into floated items */
        }
    </style>
</head>
<body>

    <div class="header">Header</div>
    <div class="menu">menu</div>
    
    <div class="main-container">
        <div class="left-side">Left side</div>
        <div class="content">Content</div>
        <div class="right-side">Right</div>
    </div>
    
    <div class="footer">Footer</div>

</body>
</html>
