<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Team Members</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
            text-align: center;
        }
        body {
            background-color: #ededed;
            padding: 40px 20px;
        }
        h2 { font-size: 28px; margin: 5px 0 40px; }
        p { font-size: 12px; text-transform: uppercase; color: #888; }
        
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .card {
            background: #fff;
            padding: 30px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }
        .name { font-weight: bold; color: #333; }
        .role { font-size: 13px; color: #777; margin: 5px 0 20px; }
        .socials { display: flex; justify-content: center; gap: 10px; }
        a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: #f0f0f0;
            border-radius: 6px;
            color: #555;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
        }
        a:hover { background: #ddd; }
    </style>
</head>
<body>

    <p>Experts</p>
    <h2>Our Team Members</h2>

    <div class="container">
        <div class="card">
            <img src="https://picsum.photos" alt="Noman">
            <div class="name">Noman</div>
            <div class="role">Programmer</div>
            <div class="socials"><a href="#">f</a><a href="#">y</a><a href="#">i</a></div>
        </div>
        <div class="card">
            <img src="https://picsum.photos" alt="Aasim">
            <div class="name">Aasim</div>
            <div class="role">CEO</div>
            <div class="socials"><a href="#">f</a><a href="#">y</a><a href="#">i</a></div>
        </div>
        <div class="card">
            <img src="https://picsum.photos" alt="Jahanzaib">
            <div class="name">Jahanzaib</div>
            <div class="role">WordPress</div>
            <div class="socials"><a href="#">f</a><a href="#">y</a><a href="#">i</a></div>
        </div>
        <div class="card">
            <img src="https://picsum.photos" alt="Faheem">
            <div class="name">Faheem</div>
            <div class="role">YouTuber</div>
            <div class="socials"><a href="#">f</a><a href="#">y</a><a href="#">i</a></div>
        </div>
    </div>

</body>
</html>
