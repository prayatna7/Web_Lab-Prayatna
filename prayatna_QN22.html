<!DOCTYPE html>
<html>
<head>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>
#main {
  width: 300px;
  height: 200px;
  display: block;
  margin-bottom: 10px;
}

.thumb {
  width: 80px;
  height: 60px;
  cursor: pointer;
}
</style>
</head>

<body>

<img id="main" src="img1.jpg">

<img class="thumb" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS7NSOyTrgSPbEtmVvizI1qicOJ72wkA4ajRA&s">
<img class="thumb" src="https://g2.img-dpreview.com/0092C98398254023B844D78BFF2EC71F.jpg">
<img class="thumb" src="https://aseantourism.travel/wp-content/uploads/waterfall-in-vietnam-1024x682.jpg">

<script>
$(".thumb").click(function(){
  $("#main").attr("src", $(this).attr("src"));
});
</script>

</body>
</html>
